<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="system-ui, sans-serif">
  <defs>
    <marker id="pf" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="840" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1a1a1a">权限判定与“优先级地板”：deny &gt; ask &gt; allow</text>

  <!-- 三档 -->
  <text x="20" y="66" font-size="12" font-weight="700" fill="#334155">三档权限（每一条工具调用都必须落到其中一档）</text>
  <rect x="20" y="80" width="250" height="64" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="32" y="102" font-size="12" font-weight="700" fill="#991b1b">deny —— 直接拒绝</text>
  <text x="32" y="120" font-size="10" fill="#374151">红线：不可被任何规则放行</text>
  <text x="32" y="134" font-size="10" fill="#374151">例：拒绝读取 .env</text>

  <rect x="295" y="80" width="250" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="307" y="102" font-size="12" font-weight="700" fill="#92400e">ask —— 询问用户</text>
  <text x="307" y="120" font-size="10" fill="#374151">TTY 弹出 [y]es/[n]o/[a]lways</text>
  <text x="307" y="134" font-size="10" fill="#374151">写操作默认这一档</text>

  <rect x="570" y="80" width="250" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="582" y="102" font-size="12" font-weight="700" fill="#166534">allow —— 自动放行</text>
  <text x="582" y="120" font-size="10" fill="#374151">无需确认，直接执行</text>
  <text x="582" y="134" font-size="10" fill="#374151">读操作默认这一档</text>

  <!-- 优先级地板 -->
  <text x="20" y="176" font-size="12" font-weight="700" fill="#334155">优先级地板（PolicyGate 合并多条规则时）</text>
  <line x1="20" y1="212" x2="820" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#pf)"/>
  <text x="160" y="206" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">deny</text>
  <text x="420" y="206" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">ask</text>
  <text x="680" y="206" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">allow</text>
  <text x="20" y="250" font-size="10" fill="#0f172a">“地板”的含义：后到的规则不能把已经算出来的权限往“低”的方向改。</text>
  <text x="20" y="270" font-size="10" fill="#475569">例：某条 deny 规则命中 .env → 即使后面有一条 allow 规则覆盖同一路径，也不会被放行。</text>
  <text x="20" y="290" font-size="10" fill="#475569">例：某条 ask 规则命中 → 后面就算来一条 allow 也无法降回 allow，只能停在“询问用户”这一档。</text>

  <!-- 交互式 SessionGate -->
  <rect x="20" y="306" width="790" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="32" y="326" font-size="12" font-weight="700" fill="#334155">交互层 SessionGate</text>
  <text x="32" y="342" font-size="10" fill="#475569">命中 ask 时询问用户；但注入口（serve/attach）的注入会话永远不能批准 —— 确认必须来自本地 TTY。</text>
</svg>
