<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="hg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker>
    <marker id="hgo" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#9333ea"/></marker>
  </defs>
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1a1a1a">HemaGuide-on-AIH：论文管线 → AIH 原语（评分是代码，编排是 LLM）</text>

  <!-- 输入 -->
  <rect x="20" y="60" width="150" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="95" y="88" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">肿瘤板病例</text>
  <text x="95" y="106" font-size="10" fill="#475569" text-anchor="middle">自由文本（去标识化）</text>

  <!-- LLM 抽取 -->
  <line x1="170" y1="95" x2="215" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#hg)"/>
  <rect x="215" y="60" width="130" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="280" y="86" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">LLM 抽取</text>
  <text x="280" y="104" font-size="10" fill="#475569" text-anchor="middle">8 节结构化</text>
  <text x="280" y="118" font-size="9" fill="#64748b" text-anchor="middle">workflow: extract</text>

  <!-- 路由 -->
  <line x1="345" y1="95" x2="390" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#hg)"/>
  <rect x="390" y="60" width="120" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="450" y="86" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">LLM 路由</text>
  <text x="450" y="104" font-size="10" fill="#475569" text-anchor="middle">选一个模式</text>
  <text x="450" y="118" font-size="9" fill="#64748b" text-anchor="middle">workflow: route</text>

  <!-- 三模式 -->
  <line x1="510" y1="95" x2="555" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#hg)"/>
  <g font-size="10">
    <rect x="555" y="52" width="265" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="687" y="72" text-anchor="middle" fill="#166534" font-weight="700">GUIDELINE → flowcharts.json（流程图分支）</text>
    <rect x="555" y="88" width="265" height="30" rx="6" fill="#fefce8" stroke="#ca8a04"/>
    <text x="687" y="108" text-anchor="middle" fill="#854d0e" font-weight="700">ADVANCED → case-memory.json（BM25 检索）</text>
    <rect x="555" y="124" width="265" height="30" rx="6" fill="#fdf2f8" stroke="#db2777"/>
    <text x="687" y="144" text-anchor="middle" fill="#9d174d" font-weight="700">MOLECULAR → 12 准则评分（lib/scorer.mjs）</text>
  </g>

  <!-- 确定性核心带 -->
  <rect x="20" y="180" width="800" height="118" rx="10" fill="#f5f3ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="36" y="204" font-size="12" font-weight="700" fill="#5b21b6">确定性核心 —— 代码执行，可审计、可断言、离线可复现（论文安全底线：数值推理不交给 LLM）</text>
  <g font-size="10">
    <rect x="36" y="218" width="230" height="66" rx="6" fill="#ffffff" stroke="#9333ea"/>
    <text x="151" y="238" text-anchor="middle" font-weight="700" fill="#334155">lib/scorer.mjs</text>
    <text x="151" y="256" text-anchor="middle" fill="#475569">12 准则 + 互斥规则 + 阈值</text>
    <text x="151" y="272" text-anchor="middle" fill="#475569">Oncogenic≥10 · VUS 0–5 · …</text>
    <rect x="282" y="218" width="230" height="66" rx="6" fill="#ffffff" stroke="#9333ea"/>
    <text x="397" y="238" text-anchor="middle" font-weight="700" fill="#334155">lib/retriever.mjs</text>
    <text x="397" y="256" text-anchor="middle" fill="#475569">BM25（CJK/latin 感知）</text>
    <text x="397" y="272" text-anchor="middle" fill="#475569">实体过滤 + 片段重叠排序</text>
    <rect x="528" y="218" width="276" height="66" rx="6" fill="#ffffff" stroke="#9333ea"/>
    <text x="666" y="238" text-anchor="middle" font-weight="700" fill="#334155">bin/hemaguide.mjs（共享 CLI）</text>
    <text x="666" y="256" text-anchor="middle" fill="#475569">score / retrieve / flowchart —— workflow 经 run_cmd 调用，</text>
    <text x="666" y="272" text-anchor="middle" fill="#475569">extension 与直接 CLI 复用同一份 lib/</text>
  </g>

  <!-- 综合 -->
  <line x1="420" y1="298" x2="420" y2="330" stroke="#9333ea" stroke-width="2" marker-end="url(#hgo)"/>
  <rect x="270" y="330" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="420" y="350" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">LLM 综合（workflow: synthesize）</text>
  <text x="420" y="366" font-size="10" fill="#475569" text-anchor="middle">引用确定性分类与点数 → 会议式决议</text>

  <!-- 输出 + PHI 门 -->
  <line x1="420" y1="374" x2="420" y2="398" stroke="#9333ea" stroke-width="2" marker-end="url(#hgo)"/>
  <rect x="230" y="398" width="380" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="420" y="418" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">konferenzbeschluss + begründung</text>
  <text x="420" y="434" font-size="10" fill="#991b1b" text-anchor="middle">尾行固定：RESEARCH USE ONLY — not for patient care</text>

  <!-- PHI gate 侧标 -->
  <rect x="640" y="398" width="180" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="730" y="418" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">PHI 安全门（tool:before）</text>
  <text x="730" y="434" font-size="9" fill="#92400e" text-anchor="middle">拦 SSN/patient-id/DOB/email</text>
  <text x="20" y="462" font-size="9" fill="#64748b">扩展钩子在瀑布流最末端执行，但 tool:before 的取消权在调用发生前生效 —— 安全层永远先于业务逻辑。</text>
</svg>
