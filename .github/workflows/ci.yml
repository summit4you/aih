name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  handoff-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build + contract check
        run: npm run check
      - name: Smoke tests
        run: npm test
